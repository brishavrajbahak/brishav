name: Premium Dataverse V2

on:
  push:
    branches:
      - main
      - feature/premium-dataverse-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run functions:build
      - uses: actions/upload-artifact@v4
        with:
          name: premium-static-export
          path: out
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e -- --project=desktop

  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/premium-dataverse-v2'
    runs-on: ubuntu-latest
    needs: [quality, browser]
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_PREVIEW_DEPLOYMENT: "1"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy noindex Cloudflare preview
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler pages deploy out --project-name=brishav-portfolio --branch=feature/premium-dataverse-v2
